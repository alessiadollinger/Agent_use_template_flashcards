<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Flashcards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Vocab Flashcards</h1>

  <form id="word-form">
    <label for="english">English</label>
    <input type="text" id="english">

    <label for="german">Deutsch</label>
    <input type="text" id="german">

    <button type="submit">Add</button>
  </form>

  <section>
    <h2>Practice</h2>
    <button type="button" id="start-practice">Start practice</button>
    <button type="button" id="next-card">Next</button>
    <button type="button" id="knew-it">I knew it</button>
    <p>I knew it count: <span id="knew-it-count">0</span></p>
    <div id="practice-card"></div>
  </section>

  <h2>My words</h2>
  <ul id="word-list"></ul>

  <script src="script.js"></script>
</body>
</html>
